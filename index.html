<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>budgetje — Personal Monthly Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login screen (shown when Firebase enabled + not signed in) -->
  <div id="loginScreen" class="login-screen" style="display:none">
    <div class="login-card">
      <div class="login-brand">budgetje</div>
      <div class="login-sub">Personal Monthly Budget</div>
      <p class="login-desc">Sign in to sync your budget across all devices.</p>
      <button id="btnGoogleSignIn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <p class="login-local-note" id="localModeNote" style="display:none">
        Running in local mode — data saved to this browser only.
        <a href="#" id="btnLocalMode">Continue without sign-in</a>
      </p>
    </div>
  </div>

  <header class="app-header">
    <div class="header-brand">
      <span class="brand-name">budgetje</span>
    </div>
    <div class="header-nav">
      <button class="nav-btn" id="btnPrev" title="Previous month">&#8249;</button>
      <div class="month-display">
        <select id="selMonth"></select>
        <select id="selYear"></select>
      </div>
      <button class="nav-btn" id="btnNext" title="Next month">&#8250;</button>
    </div>
    <div class="header-actions">
      <span id="syncDot" class="sync-dot" title="Sync status"></span>
      <button class="btn-icon" id="btnTheme" title="Toggle theme">&#9790;</button>
      <button class="btn-copy" id="btnCopy" title="Copy from last month">&#9166;</button>
      <button class="btn-secondary" id="btnClear">Reset</button>
      <button class="btn-primary" id="btnSave">Save</button>
      <div class="user-info" id="userInfo" style="display:none">
        <div class="user-avatar" id="userAvatar"></div>
        <button class="btn-signout" id="btnSignOut" title="Sign out">&#x2715;</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="budget-layout">
      <div class="expense-col" id="colLeft"></div>
      <div class="expense-col" id="colRight"></div>
      <aside class="budget-sidebar">
        <div id="incomeSection"></div>
        <div id="savingsSection"></div>
        <div id="summarySection"></div>
      </aside>
    </div>

    <div class="charts-layout">
      <div class="chart-card">
        <div class="chart-title">Projected vs. Actual (RM)</div>
        <div class="chart-wrap"><canvas id="chartPA"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Expense Distribution</div>
        <div class="chart-wrap"><canvas id="chartDist"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Savings Progress (RM)</div>
        <div class="chart-wrap chart-wrap--tall"><canvas id="chartSav"></canvas></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Firebase SDKs (loaded but only used if config is filled in) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
